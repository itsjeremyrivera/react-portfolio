<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Local navigation review</title>
<style>
body { margin: 0; background: #ddd; font: 14px system-ui; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 12px; }
select, button { padding: 8px; font: inherit; }
iframe { display: block; border: 0; transform-origin: top left; background: white; }
#viewport { margin: 0 auto; }
</style>
<header>
  <label>Viewport <select id="size"><option value="390">Phone 390px</option><option value="1440">Desktop 1440px</option></select></label>
  <label>Page <select id="page"><option value="/">Home</option><option value="/about">About</option><option value="/work/villages">The Villages</option></select></label>
  <output id="status" aria-live="polite"></output>
</header>
<div id="viewport"><iframe title="Portfolio under review" src="/" height="844"></iframe></div>
<script>
const frame = document.querySelector('iframe');
const viewport = document.querySelector('#viewport');
const size = document.querySelector('#size');
function resize() {
  const width = Number(size.value);
  const scale = Math.min(1, (window.innerWidth - 32) / width);
  frame.style.width = width + 'px';
  frame.style.transform = 'scale(' + scale + ')';
  viewport.style.width = width * scale + 'px';
  viewport.style.height = 844 * scale + 'px';
}
size.addEventListener('change', resize);
window.addEventListener('resize', resize);
document.querySelector('#page').addEventListener('change', (event) => { frame.src = event.target.value; });
setInterval(() => {
  try {
    document.querySelector('#status').textContent = frame.contentWindow.innerWidth + 'px · ' + frame.contentWindow.location.pathname + frame.contentWindow.location.hash + ' · ' + getComputedStyle(frame.contentDocument.documentElement).colorScheme;
  } catch {}
}, 250);
resize();
</script>
</html>
