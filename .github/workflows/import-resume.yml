name: Import uploaded resume PDF

on:
  push:
    branches:
      - resume/use-uploaded-dark-pdf
    paths:
      - .github/workflows/import-resume.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: resume/use-uploaded-dark-pdf

      - name: Inspect the supplied resume download
        shell: bash
        run: |
          mkdir -p public
          curl --location --fail --retry 3 \
            --dump-header /tmp/resume-headers.txt \
            --output public/JeremyR-darkResume.pdf \
            "https://drive.usercontent.google.com/download?id=1jodbGDGFVSe_hYQMdjPTVIlNo6D_NyVi&export=download&confirm=t"
          echo "RESPONSE HEADERS"
          sed -n '1,80p' /tmp/resume-headers.txt
          echo "FILE TYPE"
          file public/JeremyR-darkResume.pdf
          echo "FIRST BYTES"
          head -c 800 public/JeremyR-darkResume.pdf | tr '\n' ' ' | sed 's/</\n</g' | head -30
          echo
          if test "$(head -c 4 public/JeremyR-darkResume.pdf)" != "%PDF"; then
            exit 1
          fi

      - name: Commit the exact PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/JeremyR-darkResume.pdf
          git commit -m "docs: use supplied dark resume PDF" || exit 0
          git push origin HEAD:resume/use-uploaded-dark-pdf
